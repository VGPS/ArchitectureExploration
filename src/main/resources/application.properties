server.port=8080
spring.thymeleaf.cache=false

# Postgres and H2 jars are on the classpath but managed manually via DataSources.java.
# Exclude Spring Boot's auto-configuration so it does not try to create a DataSource bean
# from missing spring.datasource.* properties and fail on startup.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
