# slf4j-simple defaults to INFO, which silently drops the log.debug() entry/exit tracing
# required by the per-method logging convention (see CLAUDE.md). Debug level by default
# so those traces are visible without extra JVM flags. Harmless for Track A: it has zero
# log statements today.
org.slf4j.simpleLogger.defaultLogLevel=debug
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
