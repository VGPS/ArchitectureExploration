<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div>

    <!-- Error state -->
    <div th:if="${error}" class="flex items-start gap-3 p-4 bg-red-50 border border-red-200 rounded-lg">
        <span class="text-red-500 font-bold text-lg leading-none">!</span>
        <div>
            <p class="text-sm font-medium text-red-700 mb-1">Agent error</p>
            <p class="text-sm text-red-600 font-mono" th:text="${error}">error message</p>
        </div>
    </div>

    <!-- Result state -->
    <div th:if="${result}" class="space-y-5">

        <!-- Determination badge -->
        <div th:if="${result.determination == 'APPROVED'}"
             class="flex items-center gap-3 px-4 py-3 bg-green-50 border border-green-200 rounded-lg">
            <span class="w-3 h-3 rounded-full bg-green-500 flex-shrink-0"></span>
            <span class="text-green-800 font-bold text-sm tracking-wide">APPROVED</span>
        </div>
        <div th:if="${result.determination == 'DENIED'}"
             class="flex items-center gap-3 px-4 py-3 bg-red-50 border border-red-200 rounded-lg">
            <span class="w-3 h-3 rounded-full bg-red-500 flex-shrink-0"></span>
            <span class="text-red-800 font-bold text-sm tracking-wide">DENIED</span>
        </div>
        <div th:if="${result.determination == 'NEEDS_MORE_INFO'}"
             class="flex items-center gap-3 px-4 py-3 bg-amber-50 border border-amber-200 rounded-lg">
            <span class="w-3 h-3 rounded-full bg-amber-500 flex-shrink-0"></span>
            <span class="text-amber-800 font-bold text-sm tracking-wide">NEEDS MORE INFO</span>
        </div>

        <!-- Criteria checklist -->
        <div th:if="${result.hasCriteria()}">
            <p class="text-xs font-mono text-slate-400 uppercase tracking-widest mb-2">Coverage criteria</p>
            <div class="border border-slate-200 rounded-lg divide-y divide-slate-100 overflow-hidden">
                <div th:each="criterion : ${result.criteria}"
                     class="flex items-start gap-3 px-3 py-2.5">
                    <!-- Status icon -->
                    <span th:if="${criterion.status() == 'MET'}"
                          class="mt-0.5 flex-shrink-0 w-4 h-4 rounded-full bg-green-500 text-white text-xs flex items-center justify-center font-bold">&#10003;</span>
                    <span th:if="${criterion.status() == 'UNMET'}"
                          class="mt-0.5 flex-shrink-0 w-4 h-4 rounded-full bg-red-500 text-white text-xs flex items-center justify-center font-bold">&#10007;</span>
                    <span th:if="${criterion.status() == 'INSUFFICIENT'}"
                          class="mt-0.5 flex-shrink-0 w-4 h-4 rounded-full bg-amber-400 text-white text-xs flex items-center justify-center font-bold">&#8764;</span>
                    <div class="min-w-0">
                        <div class="flex items-baseline gap-2 flex-wrap">
                            <span class="text-sm font-medium text-slate-700"
                                  th:text="${criterion.criterion()}">criterion</span>
                            <span th:if="${criterion.status() == 'MET'}"
                                  class="text-xs font-semibold text-green-700 bg-green-50 px-1.5 py-0.5 rounded">MET</span>
                            <span th:if="${criterion.status() == 'UNMET'}"
                                  class="text-xs font-semibold text-red-700 bg-red-50 px-1.5 py-0.5 rounded">UNMET</span>
                            <span th:if="${criterion.status() == 'INSUFFICIENT'}"
                                  class="text-xs font-semibold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">INSUFFICIENT</span>
                        </div>
                        <p th:if="${!#strings.isEmpty(criterion.evidence())}"
                           class="text-xs text-slate-500 mt-0.5"
                           th:text="${criterion.evidence()}">evidence</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gap analysis panel (only if gaps exist) -->
        <div th:if="${result.hasGaps()}"
             class="border border-amber-200 bg-amber-50 rounded-lg px-4 py-3">
            <p class="text-xs font-semibold text-amber-700 uppercase tracking-widest mb-2">
                Action needed — documentation gaps
            </p>
            <ul class="space-y-1.5">
                <li th:each="gap : ${result.gaps}"
                    class="flex items-start gap-2 text-sm text-amber-800">
                    <span class="flex-shrink-0 mt-1 w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                    <span th:text="${gap}">gap item</span>
                </li>
            </ul>
        </div>

        <!-- Rationale -->
        <div>
            <p class="text-xs font-mono text-slate-400 uppercase tracking-widest mb-2">Rationale</p>
            <div class="bg-slate-50 rounded-lg px-4 py-3">
                <p class="text-sm text-slate-700 leading-relaxed"
                   th:text="${result.rationale}">rationale</p>
            </div>
        </div>

        <!-- Appeal letter (only if denied and appeal points exist) -->
        <div th:if="${result.determination == 'DENIED' and result.hasAppealPoints()}"
             x-data="{ open: false }">
            <button @click="open = !open"
                    class="flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-slate-700 uppercase tracking-widest mb-2">
                <span x-text="open ? '&#9660;' : '&#9654;'"></span>
                Draft appeal points
            </button>
            <div x-show="open" x-cloak
                 class="border border-slate-200 rounded-lg px-4 py-3 bg-white">
                <ul class="space-y-2">
                    <li th:each="point : ${result.appealPoints}"
                        class="flex items-start gap-2 text-sm text-slate-700">
                        <span class="flex-shrink-0 mt-1 w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                        <span th:text="${point}">appeal point</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Tool call trace (collapsible) -->
        <div th:if="${not #lists.isEmpty(result.toolCalls)}"
             x-data="{ open: false }">
            <button @click="open = !open"
                    class="flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-slate-600 uppercase tracking-widest mb-2">
                <span x-text="open ? '&#9660;' : '&#9654;'"></span>
                What the agent consulted
            </button>
            <div x-show="open" x-cloak class="space-y-2">
                <div th:each="call : ${result.toolCalls}"
                     class="border border-slate-100 rounded-lg overflow-hidden">
                    <div class="flex items-center gap-2 px-3 py-2 bg-slate-50 border-b border-slate-100">
                        <span class="text-teal-600 font-mono text-xs font-semibold"
                              th:text="${call.toolName}">tool_name</span>
                        <span class="text-slate-400 text-xs"
                              th:text="'→ ' + ${call.input}">input</span>
                    </div>
                    <div class="px-3 py-2 max-h-32 overflow-y-auto">
                        <p class="text-xs text-slate-500 font-mono whitespace-pre-wrap"
                           th:text="${#strings.abbreviate(call.output, 600)}">output</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
</body>
</html>
